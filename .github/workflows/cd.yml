name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy to Namecheap
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: dist
          path: dist/
      # The FTP sync deletes server files missing from the artifact, so a build
      # without .htaccess would also take down the SPA fallback (#136).
      - name: Check artifact
        run: |
          for f in .htaccess index.html version.json; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing from the artifact"; exit 1; }
          done
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
