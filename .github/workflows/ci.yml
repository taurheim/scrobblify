name: CI

on:
  push:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      # --no-fix: `npm run lint` auto-fixes, which would let CI silently pass.
      - run: npm run lint:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Generate version.json
        run: |
          echo '{
            "sha": "'${GITHUB_SHA::7}'",
            "fullSha": "'$GITHUB_SHA'",
            "run": '$GITHUB_RUN_NUMBER',
            "builtAt": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          }' > public/version.json
      - run: npm run build
      - name: Check build output
        run: test -f dist/.htaccess && test -f dist/index.html && test -f dist/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Without this the artifact silently drops dist/.htaccess (#136).
          include-hidden-files: true
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    # Pinned: Playwright 1.59 cannot install browsers on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:container:check
      - run: npm run test:e2e:container
      - run: npm run test:e2e:container -- --config=playwright.unreachable-worker.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
