name: Worker

# Tests the background-scrobbling worker on every PR that can affect it, and
# deploys it to Cloudflare on every push to master that can. Independent of
# CI/CD, which build and FTP the SPA.
#
# The paths cover everything the worker bundle or its test suite reads:
# src/shared/ is bundled into the worker, and the client-*.test.ts suites
# exercise src/services/.
#
# Schema migrations (worker/schema/, worker/schema-blobs/) are applied by the
# deploy job just before `wrangler deploy`. See "Schema changes" in
# worker/README.md for the rules a migration has to follow.

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - 'src/shared/**'
      - 'src/services/**'
      - '.github/workflows/worker.yml'
  # Not branch-filtered, for the same reason as pr.yml: stacked PRs.
  pull_request:
    paths:
      - 'worker/**'
      - 'src/shared/**'
      - 'src/services/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler and miniflare require Node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      # The root install is for the client-*.test.ts suites, which typecheck
      # src/services/ against the SPA's own dependencies (posthog-js, …).
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway: the newest push
    # still deploys after the current one finishes.
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Worker deps only: wrangler.toml aliases the one package src/shared/
      # imports to worker/node_modules.
      - run: npm ci
        working-directory: worker
      # Before the deploy, so new code never runs against an old schema. The
      # worker already running keeps serving through this step (and keeps
      # running if the deploy then fails), so a migration must be compatible
      # with it. A failed migration stops the job here; nothing is deployed.
      - name: Apply D1 migrations
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply scrobblify --remote
          npx wrangler d1 migrations apply scrobblify-blobs --remote
      - run: npx wrangler deploy
        working-directory: worker
      # A 503 here means a missing/short secret, a 500 an unapplied migration
      # (see worker/README.md). Retries cover a few seconds of propagation.
      - name: Smoke test
        run: curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://api.savas.ca/scrobblify/capacity
