name = "scrobblify"
main = "src/index.ts"
compatibility_date = "2026-07-26"

# `wrangler deploy` creates the DNS record and certificate for this hostname
# itself. It claims the whole of api.savas.ca, which nothing else uses; every
# route here is under /scrobblify/ so it can move to a path route later.
routes = [{ pattern = "api.savas.ca", custom_domain = true }]

# src/shared/ sits outside worker/, so a bare import there resolves against the
# repo root's node_modules, which only exists if the SPA was installed too. Pin
# it to the worker's own copy so `npm ci` in worker/ is enough to deploy (CI
# installs nothing else). scripts/run-tests.mjs mirrors this alias.
[alias]
"blueimp-md5" = "./node_modules/blueimp-md5"

# One tick every 5 minutes. Deliberately not more often: a job advances at
# roughly 750 scrobbles/day whatever we do, so a faster cron only spends the
# shared free-tier invocation budget and pushes harder on Last.fm's per-IP
# limit without finishing anything sooner.
[triggers]
crons = ["*/5 * * * *", "17 * * * *"]
# The second entry is the hourly blob sweep (BLOB_SWEEP_CRON in src/index.ts),
# which deletes the uploaded track lists of finished jobs.

# Schema changes are wrangler D1 migrations: CI runs `wrangler d1 migrations
# apply` on both databases before every deploy, which applies each file in
# migrations_dir not yet listed in that database's d1_migrations table. A file
# is tracked by name, so never edit or rename one once it has been merged.
# Every migration must work with the worker version already running, because
# that version keeps serving while it runs. See "Schema changes" in README.md.
[[d1_databases]]
binding = "DB"
database_name = "scrobblify"
database_id = "ac6eddb8-f920-4ec3-9230-a224a64ab367"
migrations_dir = "schema"

# Uploaded track chunks, kept apart from DB so a full one only refuses uploads.
# D1 rather than R2 because D1 on the Free plan stops at its limits, while R2
# bills past them with no cap. Schema: schema-blobs/.
[[d1_databases]]
binding = "BLOB_DB"
database_name = "scrobblify-blobs"
database_id = "4d3d1705-8d46-4d13-a1f0-8508bf4cd563"
migrations_dir = "schema-blobs"

[vars]
CALLBACK_URL = "https://api.savas.ca/scrobblify/auth/callback"
# Where Last.fm auth returns the user. Must be a page the SPA actually serves:
# it is built with base `/scrobblify/` in history mode, so `/scrobble` alone is
# a 404. Only its origin is used for CORS.
APP_URL = "https://savas.ca/scrobblify/scrobble"
# Public client-side ingestion token, not a personal PostHog API key.
POSTHOG_TOKEN = "phc_nhGFP4vdzuGrL5B7VGoeGRKcAtnPMvEsumoWhWTkp4a5"
POSTHOG_HOST = "https://us.i.posthog.com"

# Secrets are set with `wrangler secret put` and are never committed:
#   LASTFM_API_KEY        the worker's own server-only Last.fm application
#   LASTFM_SHARED_SECRET  its shared secret
#   SIGNING_KEY           HMAC key for handoff state and session tokens
#   CREDENTIAL_SECRET     AES-GCM key for session keys at rest
#
# For local development these live in .dev.vars, which is gitignored. Note that
# `wrangler secret put` writes to the deployed environment only: setting a
# secret locally does not set it in production, and vice versa.

# The feasibility spike is kept as evidence for the concurrency cap but is not
# deployed. Run it with:
#   wrangler dev --local --config wrangler.spike.toml
